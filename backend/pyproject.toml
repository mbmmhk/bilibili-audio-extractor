[project]
name = "songline"
version = "0.1.0"
description = "Find which songs are sung in a Bilibili video, with a timeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.8.1",
    "mlx-whisper>=0.4.3",
    "opencc-python-reimplemented>=0.1.7",
    "pydantic>=2",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "shazamio>=0.9.0",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
songline = "songline:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
