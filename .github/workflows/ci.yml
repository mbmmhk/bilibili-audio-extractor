name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # mlx-whisper only installs on Apple Silicon; macos-latest runners are M-series.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Swift package tests
        run: swift test --package-path mac/Packages/SonglineKit
      # 和正式发布用同一个脚本：每个 PR 都检查能不能打包（包括 uv 有没有打进 App）。
      - name: Build Songline.app and the .dmg
        run: mac/scripts/package.sh "0.0.0-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Songline-dmg
          path: mac/dist/*.dmg
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build # type-check (tsc -b) + bundle
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

  publish-web:
    # install.sh downloads this prebuilt UI, so users don't need Node.js.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - run: tar -czf web-dist.tgz -C dist .
      - run: |
          gh release view web-latest >/dev/null 2>&1 || gh release create web-latest --prerelease \
            --title "Web UI (latest build)" --notes "Prebuilt frontend for install.sh, rebuilt on every push to master."
          gh release upload web-latest web-dist.tgz --clobber
